services:
  kubelabs:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/kubelabs-io/kubelabs:1.0.0
    container_name: kubelabs-platform
    ports:
      - "4100:4100"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=4100
    volumes:
      - kubelabs_sqlite_data:/app/data
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  kubelabs_sqlite_data:

