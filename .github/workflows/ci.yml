name: KubeLabs CI & Solver Verification

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-matrix:
    name: Cross-Platform Audit & Lab Solver Matrix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Syntax & Static Lint Verification
        run: |
          node --check src/server.js
          node --check src/api/router.js
          node --check src/db/database.js
          node --check src/core/virtualCluster.js
          node --check src/core/terminalEngine.js
          node --check src/core/incidentEngine.js
          node --check src/core/certificationEngine.js
          node --check public/js/app.js
          node --check public/js/offlineEngine.js

      - name: Run 11-Agent Self-Audit & Schema Quality Gates
        run: npm run audit:self

      - name: Run 54-Subphase Sequential Verification Ledger
        run: npm run verify:subphases

      - name: Run Unit, Integration, Security & E2E Lab Solver Tests
        run: npm test

      - name: Package All Cross-Platform Apps
        if: matrix.os == 'ubuntu-latest'
        run: |
          node scripts/package-release.js

      - name: Upload Windows Portable App
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: kubelabs-windows-app
          path: dist/apps/windows

      - name: Upload Linux Portable App
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: kubelabs-linux-app
          path: dist/apps/linux

      - name: Upload macOS Portable App
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: kubelabs-macos-app
          path: dist/apps/macos

      - name: Upload Web & PWA Standalone App
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: kubelabs-web-pwa-app
          path: dist/apps/web-pwa

      - name: Upload Kubernetes & Helm Deployment Package
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: kubelabs-helm-k8s-app
          path: dist/apps/helm-k8s

      - name: Upload Standalone Release Packages & Checksums
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: kubelabs-release-packages
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS.txt
