name: KubeLabs CI & Solver Verification

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-matrix:
    name: Cross-Platform Audit & Lab Solver Matrix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: "25.x"

      - name: Syntax & Static Lint Verification
        run: |
          node --check src/server.js
          node --check src/api/router.js
          node --check src/db/database.js
          node --check src/engine/virtualCluster.js
          node --check src/engine/terminalEngine.js
          node --check src/engine/incidentEngine.js
          node --check src/engine/certificationEngine.js
          node --check public/js/app.js
          node --check public/js/offlineEngine.js

      - name: Run 11-Agent Self-Audit & Schema Quality Gates
        run: npm run audit:self

      - name: Run 40-Subphase Sequential Verification Ledger
        run: npm run verify:subphases

      - name: Run Unit, Integration, Security & E2E Lab Solver Tests
        run: npm test

      - name: Package Universal App Distribution
        if: matrix.os == 'ubuntu-latest'
        run: |
          node scripts/package-release.js

      - name: Upload KubeLabs Application Build Artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: kubelabs-universal-app
          path: dist/*

