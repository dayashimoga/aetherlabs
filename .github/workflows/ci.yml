name: KubeLabs CI & Solver Verification

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-matrix:
    name: Cross-Platform Audit & Lab Solver Matrix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: "25.x"

      - name: Run 11-Agent Self-Audit & Schema Quality Gates
        run: npm run audit:self

      - name: Run Unit, Integration, Security & E2E Lab Solver Tests
        run: npm test

