name: Security & Supply-Chain Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: read

jobs:
  security-gate:
    name: SAST, Sandbox Isolation & Zero-Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Verify Zero External Runtime Dependencies & Sandbox Integrity
        run: |
          npm run audit:self
          npm run verify:subphases

      - name: Execute Security, Ed25519 Signature Forgery & Injection Prevention Suite
        run: npm test
