name: Cross-Platform Release Pipeline

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release-bundle:
    name: Build & Verify Standalone Cross-Platform Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "25.x"

      - name: Run Full Self-Audit & Solver Verification
        run: |
          npm run audit:self
          npm test

      - name: Package Cross-Platform Distribution Archive
        run: |
          mkdir -p dist
          tar -czf dist/kubelabs-${{ github.ref_name }}-universal.tar.gz \
            package.json README.md docs agents schemas plugins src public scripts
          sha256sum dist/kubelabs-${{ github.ref_name }}-universal.tar.gz > dist/SHA256SUMS.txt

