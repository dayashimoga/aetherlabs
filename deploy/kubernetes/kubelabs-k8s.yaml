apiVersion: v1
kind: Namespace
metadata:
  name: kubelabs-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubelabs-sa
  namespace: kubelabs-system
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kubelabs-platform
  namespace: kubelabs-system
  labels:
    app: kubelabs-platform
spec:
  serviceName: kubelabs-svc
  replicas: 2
  selector:
    matchLabels:
      app: kubelabs-platform
  template:
    metadata:
      labels:
        app: kubelabs-platform
    spec:
      serviceAccountName: kubelabs-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kubelabs
          image: ghcr.io/kubelabs-io/kubelabs:2.0.0
          ports:
            - containerPort: 4100
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 150Mi
          livenessProbe:
            httpGet:
              path: /api/livez
              port: 4100
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/readyz
              port: 4100
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: sqlite-data
              mountPath: /app/data
  volumeClaimTemplates:
    - metadata:
        name: sqlite-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kubelabs-svc
  namespace: kubelabs-system
spec:
  type: ClusterIP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  selector:
    app: kubelabs-platform
  ports:
    - name: http
      port: 80
      targetPort: 4100
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubelabs-ingress
  namespace: kubelabs-system
spec:
  ingressClassName: cilium
  rules:
    - host: learn.kubelabs.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kubelabs-svc
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubelabs-zero-trust
  namespace: kubelabs-system
spec:
  podSelector:
    matchLabels:
      app: kubelabs-platform
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 4100
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
