[package]
name = "kubelabs-desktop"
version = "3.0.0"
description = "KubeLabs Desktop Host - Standalone Low-Resource Cloud-Native Lab Platform"
authors = ["KubeLabs Core Contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
